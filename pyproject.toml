[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morin127-longctx_jd054"
version = "0.1.0"
description = "把候选项映射到类别上，算出长上下文优化工程师·尾延迟抖动与首 token 时间的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "morin127" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://morin127.github.io"
Repository = "https://github.com/morin127/longctx_jd054"
Issues = "https://github.com/morin127/longctx_jd054/issues"

[project.scripts]
longctx_jd054 = "longctx_jd054:main"

[tool.setuptools]
py-modules = ["longctx_jd054"]
